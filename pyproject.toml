[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "kod"
version = "0.0.0"
description = "KodOS - Declarative Linux system configuration"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
dependencies = [
    "click>=8.0",
    "lupa>=1.13",
    "chorut>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-timeout>=2.1",
]

[project.scripts]
kod = "kod.kod:cli"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "--strict-markers -v"
markers = [
    "phase1: Config system tests",
    "phase2: Python refactoring tests",
    "phase3: Program registry tests",
    "phase5: Custom package tests",
    "integration: Integration tests",
    "slow: Slow tests (skip with -m 'not slow')",
]
